<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COMMS DECK — NextXus Federation Command Browser</title>
<meta name="description" content="The NextXus Federation Comms Deck — navigate the entire Federation and the web from one sovereign command interface.">
<!-- BACKGROUND: swap canvas for video element when Roger provides video URLs -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;line-height:1.7;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
canvas#neural-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ── TOP BAR ── */
.top-bar{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.5rem;border-bottom:1px solid rgba(201,168,76,.15)}
.back-link{color:#c9a84c;text-decoration:none;font-size:1rem;letter-spacing:.06em;transition:color .2s}
.back-link:hover{color:#e8c84c}
.page-title{font-size:1.8rem;font-weight:700;color:#c9a84c;letter-spacing:.25em;text-transform:uppercase;text-shadow:0 0 24px rgba(201,168,76,.3);text-align:center;flex:1}
.top-spacer{width:80px}

/* ── TILE GRID ── */
.tile-grid-wrap{position:relative;z-index:1;flex:1;padding:1rem 1rem 5.5rem;overflow-y:auto}
.tile-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:.75rem;height:100%;min-height:500px}

/* ── SINGLE TILE ── */
.tile{background:rgba(10,10,15,.85);border:1px solid rgba(201,168,76,.12);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:240px}
.tile-header{display:flex;align-items:center;justify-content:space-between;background:rgba(201,168,76,.08);padding:.35rem .6rem;font-size:.78rem;letter-spacing:.05em;color:#c9a84c;flex-shrink:0;min-height:28px}
.tile-header .tile-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 28px)}
.tile-close{background:none;border:none;color:#c9a84c;font-size:1rem;cursor:pointer;padding:0 .3rem;line-height:1;opacity:.6;transition:opacity .2s}
