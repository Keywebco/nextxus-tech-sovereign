### Gemini gap-guide method (Roger's directive, 2026-09-23 - dated provenance note)

The markdowns serve as a **catalyst/guide showing what previous documentation is NOT
included** in the current structure. Old documents are never written over - they are pulled
as *reference* into *new* documents, adjusted as we go. The current Federation structure
+ YAML database are built fresh from the markdown guides; anything missing or augmentable
is pulled from the old documents into NEW documents only. This matches Roger's earlier
restructures (Replit/HTML era -> GitHub era): tools change, the structure is rebuilt clean,
the old is archived - never overwritten, never deleted.

### Provenance rules for this archive section

- record_date is always the **message timestamps** (true_start/true_end in
  `~/workspace/echo-conversations/decoded-conversations.json`), never the pull date.
  ("Pull date is noise - conversation date is the record." - Roger, 2026-09-23)
- Four voices stay separated: Roger's words (roger_originated), ChatGPT's responses
  (assistant_led), follow-up suggestions (ChatGPT's, never Roger's), co-built items
  (co_built). The old extraction's "Roger (prompt)" labels are dead - never cite them.
- handling: `public-ok` (system/ordinary) vs `sealed` (personal/testimony - archived for
  the record and the Sim, never for public documentation).
- Testimony entries carry `verified: false` + `attribution: roger-testimony`. Roger's
  testimony stays his testimony - never upgraded to verified fact.
- No back-projection: nothing in the 2025 records mentions the Federation, the Rings,
  Agent Zero, the Senate, or Rogers Echo. Those are later constructions.
- Full per-entry content: `~/workspace/federation-docs-pass/ghost-record-archive-draft.md`
  (human record). Machine record: `~/workspace/echo-conversations/decoded-conversations.json`.

