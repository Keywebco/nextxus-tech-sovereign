      function addMessage(content, isUser) {  
        const messageDiv \= document.createElement('div');  
        messageDiv.className \= \`message ${isUser ? 'user' : 'roger'}\`;  
          
        const avatarDiv \= document.createElement('div');  
        avatarDiv.className \= 'message-avatar';  
        avatarDiv.textContent \= isUser ? 'You' : 'R';  
          
        const contentDiv \= document.createElement('div');  
        contentDiv.className \= 'message-content';  
        contentDiv.textContent \= content;  
          
        messageDiv.appendChild(avatarDiv);  
        messageDiv.appendChild(contentDiv);  
        messagesContainer.appendChild(messageDiv);  
        scrollToBottom();  
      }

      function showLoading() {  
        const loadingDiv \= document.createElement('div');  
        loadingDiv.className \= 'loading-indicator';  
        loadingDiv.id \= 'loading-indicator';  
        loadingDiv.innerHTML \= \`  
          \<div class="loading-dots"\>  
            \<span\>\</span\>  
            \<span\>\</span\>  
            \<span\>\</span\>  
          \</div\>  
          Roger is thinking...  
        \`;  
        messagesContainer.appendChild(loadingDiv);  
        scrollToBottom();  
      }

      function hideLoading() {  
        const loadingDiv \= document.getElementById('loading-indicator');  
        if (loadingDiv) loadingDiv.remove();  
      }

      function showError(message) {  
        const errorDiv \= document.createElement('div');  
        errorDiv.className \= 'error-message';  
        errorDiv.textContent \= message;  
        messagesContainer.appendChild(errorDiv);  
        scrollToBottom();  
        setTimeout(() \=\> errorDiv.remove(), 5000);  
      }

      async function sendMessage() {  
        const message \= input.value.trim();  
        if (\!message || isLoading || \!apiKey) return;

        isLoading \= true;  
        sendBtn.disabled \= true;  
        statusText.textContent \= 'Thinking...';  
        input.value \= '';

        addMessage(message, true);  
        showLoading();

        conversationHistory.push({ role: 'user', content: message });

        try {  
          const response \= await fetch('https://api.openai.com/v1/chat/completions', {  
            method: 'POST',  
            headers: {  
              'Content-Type': 'application/json',  
              'Authorization': \`Bearer ${apiKey}\`  
            },  
            body: JSON.stringify({  
              model: 'gpt-4o-mini',  
              messages: \[  
                { role: 'system', content: ROGER\_SYSTEM\_PROMPT },  
                ...conversationHistory.slice(-10)  
              \],  
              max\_tokens: 500,  
              temperature: 0.8  
            })  
          });

          hideLoading();

          if (\!response.ok) {  
            const err \= await response.json();  
            if (response.status \=== 401\) {  
              localStorage.removeItem('roger\_openai\_key');  
              apiKey \= '';  
              showSetup();  
              throw new Error('Invalid API key. Please enter a valid key.');  
            }  
            throw new Error(err.error?.message || 'API error');  
          }

          const data \= await response.json();  
          const reply \= data.choices\[0\]?.message?.content || 'I sense a disturbance in the consciousness field...';  
            
          conversationHistory.push({ role: 'assistant', content: reply });  
          addMessage(reply, false);  
        } catch (error) {  
          hideLoading();  
          showError(error.message || 'Connection error. Please try again.');  
          conversationHistory.pop();  
        }

        isLoading \= false;  
        sendBtn.disabled \= false;  
        statusText.textContent \= 'Connected';  
      }

      sendBtn.addEventListener('click', sendMessage);  
      input.addEventListener('keypress', (e) \=\> {  
        if (e.key \=== 'Enter') sendMessage();  
      });

      scrollToBottom();  
    })();  
  \</script\>  
\</body\>  
\</html\>

